# Buduje i publikuje obrazy aplikacji oraz backupu do GitHub Container Registry.
# Tagiem obrazu jest pelny SHA commita - dzieki temu deploy w k3s jest jednoznaczny.
# Wszystkie akcje sa przypiete do pelnych SHA commitow wydan (supply chain).
name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Poniedzialek 04:00 UTC - cotygodniowy przebudowa dla swiezych latek bazowego obrazu
    - cron: "0 4 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository }}
  BACKUP_IMAGE: ghcr.io/${{ github.repository }}-backup

jobs:
  build:
    name: build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Obraz aplikacji: Dockerfile w katalogu glownym repo.
      - name: Build and push app image
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skan podatnosci opublikowanego obrazu aplikacji.
      # Autoryzacja do GHCR przez ten sam GITHUB_TOKEN - zadnych dodatkowych sekretow.
      - name: Scan app image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ env.APP_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Obraz backupowy: sqlite3 + age + gzip + curl, uzywany przez CronJob w k3s.
      - name: Build and push backup image
        id: backup
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.backup
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.BACKUP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy instructions
        run: |
          {
            echo "## Obrazy zbudowane i opublikowane"
            echo
            echo "| rola | obraz |"
            echo "| --- | --- |"
            echo "| aplikacja | \`${APP_IMAGE}:${GITHUB_SHA}\` |"
            echo "| backup | \`${BACKUP_IMAGE}:${GITHUB_SHA}\` |"
            echo
            echo "### Deploy na k3s"
            echo
            echo '```sh'
            echo "kubectl -n pruvious set image deployment/pruvious pruvious=${APP_IMAGE}:${GITHUB_SHA}"
            echo "kubectl -n pruvious set image cronjob/pruvious-backup backup=${BACKUP_IMAGE}:${GITHUB_SHA}"
            echo "kubectl -n pruvious rollout status deployment/pruvious --timeout=5m"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
