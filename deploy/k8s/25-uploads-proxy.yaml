# Pruvious w produkcji NIE serwuje /uploads sam: modul robi symlink public/uploads
# tylko w trybie dev, a referencyjny deployment Pruvious stawia przed aplikacja nginx.
# Odtwarzamy to jako sidecar: nginx jest frontem poda, oddaje pliki z PVC,
# a reszte proxuje do Nitro na 127.0.0.1:3000.
apiVersion: v1
kind: ConfigMap
metadata: { name: uploads-proxy, namespace: pruvious }
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      access_log    off;
      sendfile      on;
      server_tokens off;

      # read-only rootfs: wszystko tymczasowe do /tmp
      client_body_temp_path /tmp/client_body;
      proxy_temp_path       /tmp/proxy;
      fastcgi_temp_path     /tmp/fastcgi;
      uwsgi_temp_path       /tmp/uwsgi;
      scgi_temp_path        /tmp/scgi;

      client_max_body_size 64m;

      server {
        listen 8080;
        server_name _;

        location /uploads/ {
          alias /data/uploads/;
          autoindex off;
          add_header Cache-Control "public, max-age=2592000, immutable" always;
          add_header X-Content-Type-Options "nosniff" always;
          # druga linia obrony przy SVG/HTML w uploadach (pierwsza to CSP na edge'u CF)
          add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
          try_files $uri =404;
        }

        location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        "upgrade";
          proxy_read_timeout 120s;
        }
      }
    }
