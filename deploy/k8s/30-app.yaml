apiVersion: apps/v1
kind: Deployment
metadata: { name: pruvious, namespace: pruvious }
spec:
  replicas: 1
  strategy: { type: Recreate }        # SQLite + PVC RWO: nigdy dwa pody na tej samej bazie
  selector: { matchLabels: { app: pruvious } }
  template:
    metadata: { labels: { app: pruvious } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [ { name: ghcr } ]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: init-dirs
          image: ghcr.io/ulyanadziakovich/nb-cms:__IMAGE_TAG__
          command: ["sh", "-c", "mkdir -p /data/db /data/uploads /data/backups"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [ { name: data, mountPath: /data } ]
      containers:
        - name: app
          image: ghcr.io/ulyanadziakovich/nb-cms:__IMAGE_TAG__
          ports: [ { name: http, containerPort: 3000 } ]
          env:
            - { name: NODE_ENV, value: production }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=512" }
            # Wszystko, co aplikacja zapisuje, musi trafic na /data (PVC) albo /tmp (emptyDir)
            - { name: NUXT_PRUVIOUS_DATABASE, value: "sqlite:/data/db/pruvious.db" }
            - { name: NUXT_PRUVIOUS_UPLOADS_DRIVE_PATH, value: "/data/uploads" }
            - { name: NUXT_PRUVIOUS_PAGE_CACHE_PATH, value: "/tmp/page-cache" }
          envFrom:
            - secretRef: { name: pruvious-app }   # NUXT_PRUVIOUS_JWT_SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          # UWAGA: "/" zwraca 404 na pustym CMS-ie, wiec probe pyta o endpoint statusu
          readinessProbe:
            httpGet: { path: /api/installed, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/installed, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: pruvious-data }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: pruvious, namespace: pruvious }
spec:
  type: ClusterIP
  selector: { app: pruvious }
  ports: [ { name: http, port: 3000, targetPort: http } ]
